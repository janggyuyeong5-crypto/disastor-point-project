<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>카카오 지도 프레임</title>
    <style>
        /* [핵심] html, body, map의 높이를 화면 전체 높이(100vh)로 강제 지정하여 도화지가 접히지 않게 합니다 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100vh; overflow: hidden; }
        #map { width: 100%; height: 100vh; background-color: #f8fafc; }
    </style>
    <!-- 카카오맵 SDK (autoload=false를 붙여 우리가 원할 때 안전하게 로드하도록 설정) -->
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=fb918912c351246220dec79f1b6ba2d7&autoload=false"></script>
</head>
<body>

<!-- 지도가 그려질 도화지 -->
<div id="map"></div>

<script>
    var map = null;
    var currentMarkers = [];

    // 카카오맵 SDK가 완전히 준비되면 지도를 생성합니다.
    kakao.maps.load(function() {
        var container = document.getElementById('map');
        var options = {
            center: new kakao.maps.LatLng(37.4954, 127.0333), // 강남권 중심 좌표
            level: 5
        };
        map = new kakao.maps.Map(container, options);
    });

    // 메인 화면(index.html)에서 마커를 찍으라고 호출하는 함수
    function setMarkers(dataList) {
        // 지도가 아직 덜 켜졌으면 0.1초 뒤에 다시 시도하는 안전장치
        if (!map) {
            setTimeout(function() { setMarkers(dataList); }, 100);
            return;
        }

        // 기존 마커 지우기
        currentMarkers.forEach(m => m.setMap(null));
        currentMarkers = [];

        if (!dataList || dataList.length === 0) return;

        // 새로운 마커 생성 및 지도에 부착
        dataList.forEach(item => {
            var pos = new kakao.maps.LatLng(item.lat, item.lng);
            var marker = new kakao.maps.Marker({
                position: pos,
                title: item.name
            });
            marker.setMap(map);
            currentMarkers.push(marker);
        });

        // 첫 번째 대피소 위치로 부드럽게 화면 이동
        panToLocation(dataList[0].lat, dataList[0].lng);
    }

    // 지도의 중심 좌표를 부드럽게 이동시키는 함수
    function panToLocation(lat, lng) {
        if (map) {
            var moveLatLon = new kakao.maps.LatLng(lat, lng);
            map.panTo(moveLatLon);
        }
    }
</script>
</body>
</html>
