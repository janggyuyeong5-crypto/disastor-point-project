<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>카카오 지도 프레임</title>
    <style>
        /* 부모 영역에 맞추어 100% 꽉 차도록 여백 및 크기 지정 */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
            background-color: #f8fafc;
        }
    </style>
    <!-- 카카오맵 SDK (autoload=false) -->
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=fb918912c351246220dec79f1b6ba2d7&autoload=false"></script>
</head>
<body>

<div id="map"></div>

<script>
    var map = null;
    var currentMarkers = [];
    var isMapReady = false;

    // 1. 카카오맵 SDK 로딩 후 지도 객체 초기화
    kakao.maps.load(function () {
        var container = document.getElementById('map');
        var options = {
            center: new kakao.maps.LatLng(37.4954, 127.0333), // 기본 중심: 강남역
            level: 7
        };
        map = new kakao.maps.Map(container, options);
        isMapReady = true;

        // 지도가 처음 그려진 직후 도화지 크기 자동 보정
        map.relayout();
    });

    /**
     * 2. 부모창(index.html)에서 새 대피소 목록을 받아 마커를 그리는 함수
     */
    function setMarkers(dataList) {
        // 지도가 아직 완전히 생성되지 않았으면 0.15초 후 재시도
        if (!isMapReady || !map) {
            setTimeout(function () {
                setMarkers(dataList);
            }, 150);
            return;
        }

        // (1) 이전 마커 전부 삭제
        for (var i = 0; i < currentMarkers.length; i++) {
            currentMarkers[i].setMap(null);
        }
        currentMarkers = [];

        if (!dataList || dataList.length === 0) return;

        // (2) 지도 렌더링 영역 재계산
        map.relayout();

        var bounds = new kakao.maps.LatLngBounds();
        var validCount = 0;

        // 안정적인 성능을 위해 상위 50개 마커 우선 표시
        var targets = dataList.slice(0, 50);

        targets.forEach(function (shelter) {
            var lat = Number(shelter.lat);
            var lng = Number(shelter.lng);

            if (!isNaN(lat) && !isNaN(lng) && lat > 0 && lng > 0) {
                var position = new kakao.maps.LatLng(lat, lng);
                var marker = new kakao.maps.Marker({
                    position: position,
                    map: map,
                    title: shelter.name || ''
                });

                currentMarkers.push(marker);
                bounds.extend(position);
                validCount++;
            }
        });

        // (3) 마커들이 화면에 꽉 차게 보이도록 지도 중심 및 줌 레벨 조정
        if (validCount > 0) {
            setTimeout(function () {
                map.relayout();
                map.setBounds(bounds);
            }, 100);
        }
    }

    /**
     * 3. 목록 카드 클릭 시 해당 위치로 지도 이동
     */
    function panToLocation(lat, lng) {
        if (!isMapReady || !map) return;
        map.relayout();
        var movePos = new kakao.maps.LatLng(Number(lat), Number(lng));
        map.panTo(movePos);
    }
</script>
</body>
</html>
