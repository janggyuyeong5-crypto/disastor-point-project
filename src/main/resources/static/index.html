<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대피할지도 - 재난 안전 대피소 통합 플랫폼</title>

    <!-- 1. Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 2. FontAwesome 아이콘 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

<!-- ================================================================= -->
<!-- [헤더 구역] 로고 + 중앙 검색창 -->
<!-- ================================================================= -->
<header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 h-16 relative flex items-center justify-between">

        <!-- 좌측 로고 (클릭 시 새로고침) -->
        <div class="flex items-center gap-2.5 shrink-0 cursor-pointer z-10" onclick="location.reload()">
            <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center text-white text-lg shadow-sm">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <span class="text-base font-bold text-slate-900">대피할지도</span>
        </div>

        <!-- 중앙 검색창 (엔터키 또는 버튼 클릭 시 검색 실행) -->
        <div class="absolute left-1/2 -translate-x-1/2 w-full max-w-md px-4">
            <div class="relative flex items-center">
                <i class="fa-solid fa-magnifying-glass absolute left-3 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput"
                       placeholder="대피소 명칭 또는 주소 검색 (예: 종로구)"
                       class="w-full bg-slate-100 text-sm rounded-lg pl-9 pr-16 py-2 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition"
                       onkeypress="if(event.key === 'Enter') executeSearch()">
                <button onclick="executeSearch()"
                        class="absolute right-1.5 px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-md transition shadow-sm">
                    검색
                </button>
            </div>
        </div>

        <div class="w-9 shrink-0"></div>
    </div>
</header>

<!-- ================================================================= -->
<!-- [메인 본문 구역] 탭 버튼 + (좌: 목록 1칸 / 우: 지도 3칸) -->
<!-- ================================================================= -->
<main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-5">

    <!-- 재난 유형 선택 탭 3종 -->
    <div class="grid grid-cols-3 gap-3">
        <button id="tab-earthquake" onclick="switchDisaster('earthquake')"
                class="tab-btn p-3.5 rounded-xl border-2 border-blue-600 bg-white shadow-sm flex items-center justify-center gap-2 font-bold text-blue-600 transition">
            🏢 지진 대피소
        </button>
        <button id="tab-flood" onclick="switchDisaster('flood')"
                class="tab-btn p-3.5 rounded-xl border border-slate-200 bg-white shadow-sm flex items-center justify-center gap-2 font-semibold text-slate-600 hover:bg-slate-50 transition">
            🌊 수해 시설
        </button>
        <button id="tab-airraid" onclick="switchDisaster('airraid')"
                class="tab-btn p-3.5 rounded-xl border border-slate-200 bg-white shadow-sm flex items-center justify-center gap-2 font-semibold text-slate-600 hover:bg-slate-50 transition">
            💣 공습 대피소
        </button>
    </div>

    <!-- 화면 분할 구역 -->
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-4 mt-5">
        <!-- [좌측] 목록 패널 -->
        <div class="lg:col-span-1 bg-white rounded-2xl border border-slate-200 p-4 shadow-sm flex flex-col h-[600px]">
            <h2 class="font-bold text-slate-800 text-sm mb-3 pb-2 border-b border-slate-100" id="panelHeader">
                📊 지진 대피소 목록
            </h2>
            <div id="resultsList" class="space-y-3 overflow-y-auto pr-1 flex-1"></div>
        </div>

        <!-- [우측] 지도 iframe 프레임 -->
        <div class="lg:col-span-3 bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden h-[600px]">
            <iframe id="mapFrame" src="map.html" class="w-full h-full border-0"></iframe>
        </div>
    </div>
</main>

<!-- ================================================================= -->
<!-- [자바스크립트 로직] -->
<!-- ================================================================= -->
<script>
    // 1. 상태 및 캐시 저장소
    const shelterDatabase = {
        earthquake: [
            { id: 1, name: '역삼초등학교 운동장', address: '서울특별시 강남구 역삼로 123', lat: 37.4954, lng: 127.0333 },
            { id: 2, name: '도곡근린공원 야외광장', address: '서울특별시 강남구 도곡로 456', lat: 37.4902, lng: 127.0421 }
        ],
        flood: [
            { id: 3, name: '잠원동 주민센터 대피시설', address: '서울특별시 서초구 잠원로 88', lat: 37.5144, lng: 127.0118 }
        ],
        airraid: [] // DB에서 조회하여 채울 빈 배열
    };

    let currentType = 'earthquake';
    let airraidLoading = false;

    // 2. 우측 지도 iframe 로딩 완료 시 초기 지진 대피소 표출
    document.getElementById('mapFrame').onload = function () {
        switchDisaster('earthquake');
    };

    // 3. 탭 전환 및 비동기 데이터 처리 함수
    async function switchDisaster(type) {
        currentType = type;
        const tabs = ['earthquake', 'flood', 'airraid'];

        // 버튼 스타일 활성화/비활성화 처리
        tabs.forEach(t => {
            const btn = document.getElementById(`tab-${t}`);
            if (!btn) return;
            if (t === type) {
                btn.className = "tab-btn p-3.5 rounded-xl border-2 border-blue-600 bg-white shadow-sm flex items-center justify-center gap-2 font-bold text-blue-600 transition";
            } else {
                btn.className = "tab-btn p-3.5 rounded-xl border border-slate-200 bg-white shadow-sm flex items-center justify-center gap-2 font-semibold text-slate-600 hover:bg-slate-50 transition";
            }
        });

        // 상단 패널 제목 갱신
        const titleMap = { earthquake: '🏢 지진 대피소', flood: '🌊 수해 시설', airraid: '💣 공습 대피소' };
        const headerElement = document.getElementById('panelHeader');
        if (headerElement) headerElement.innerText = `📊 ${titleMap[type]} 목록`;

        // 검색창 초기화
        const searchInput = document.getElementById('searchInput');
        if (searchInput) searchInput.value = '';

        // [핵심] 공습 대피소 데이터가 아직 없으면 DB API 비동기 호출
        if (type === 'airraid' && shelterDatabase.airraid.length === 0) {
            try {
                const response = await fetch('http://localhost:8080/api/shelters/air');
                const dbData = await response.json();

                shelterDatabase.airraid = dbData
                    .map(item => {
                        // [핵심 해결] DB 컬럼 데이터가 서로 바뀌어 있으므로 교차해서 매핑합니다!
                        // DB의 lot(37.xx) -> 위도(lat)로 할당
                        const realLat = Number(item.lot);
                        // DB의 lat(127.xx) -> 경도(lng)로 할당
                        const realLng = Number(item.lat);

                        return {
                            id: item.shlt_id,
                            name: item.fclt_nm || '이름 없음',
                            address: item.daddr || '주소 정보 없음',
                            lat: realLat, // 37.xx가 들어감
                            lng: realLng  // 127.xx가 들어감
                        };
                    })
                    .filter(item => {
                        // 서울/수도권 정상 범위(위도 33~39, 경도 124~132) 검증
                        return (
                            !isNaN(item.lat) && !isNaN(item.lng) &&
                            item.lat >= 33 && item.lat <= 39 &&
                            item.lng >= 124 && item.lng <= 132
                        );
                    });

                console.log(`✅ 좌표 교정 완료! 유효 대피소: ${shelterDatabase.airraid.length}개`);

            } catch (error) {
                console.error('공습 대피소 통신 에러:', error);
            }
        }

        // 데이터가 완전히 준비된 후 화면과 지도 갱신
        const dataList = shelterDatabase[type] || [];
        renderListCards(dataList);
        updateMapWithFrame(dataList);
    }

    // 4. 키워드 검색 처리 함수
    function executeSearch() {
        const searchInput = document.getElementById('searchInput');
        const keyword = searchInput.value.trim();
        const currentDataList = shelterDatabase[currentType] || [];

        if (keyword === '') {
            renderListCards(currentDataList);
            updateMapWithFrame(currentDataList);
            return;
        }

        const filteredList = currentDataList.filter(shelter => {
            const matchName = shelter.name && shelter.name.includes(keyword);
            const matchAddr = shelter.address && shelter.address.includes(keyword);
            return matchName || matchAddr;
        });

        renderListCards(filteredList);
        updateMapWithFrame(filteredList);
    }

    // 5. 좌측 대피소 카드 동적 생성 (속도 최적화를 위해 상위 100개 슬라이싱)
    function renderListCards(dataList) {
        const listArea = document.getElementById('resultsList');
        listArea.innerHTML = '';

        if (!dataList || dataList.length === 0) {
            listArea.innerHTML = `<div class="p-6 text-center text-xs text-slate-400">조건에 일치하는 대피소가 없습니다.</div>`;
            return;
        }

        const displayList = dataList.slice(0, 100);

        displayList.forEach((shelter, index) => {
            const card = document.createElement('div');
            card.className = "border border-slate-200 rounded-xl p-3 bg-slate-50 hover:bg-blue-50 hover:border-blue-300 cursor-pointer transition";

            // 카드 클릭 시 지도 이동 함수 호출
            card.onclick = function () {
                const frame = document.getElementById('mapFrame');
                if (frame && frame.contentWindow && typeof frame.contentWindow.panToLocation === 'function') {
                    frame.contentWindow.panToLocation(shelter.lat, shelter.lng);
                }
            };

            card.innerHTML = `
                <div class="flex items-center justify-between mb-1">
                    <span class="bg-blue-100 text-blue-700 text-[10px] font-bold px-1.5 py-0.5 rounded">No.${index + 1}</span>
                </div>
                <h3 class="text-sm font-bold text-slate-900">${shelter.name}</h3>
                <p class="text-xs text-slate-500 mt-1">📍 ${shelter.address}</p>
            `;
            listArea.appendChild(card);
        });
    }

    // 6. iframe 내부 지도 함수(setMarkers) 호출
    function updateMapWithFrame(dataList) {
        const frame = document.getElementById('mapFrame');
        if (frame && frame.contentWindow && typeof frame.contentWindow.setMarkers === 'function') {
            frame.contentWindow.setMarkers(dataList);
        }
    }
</script>
</body>
</html>
